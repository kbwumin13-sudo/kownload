<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>kownload 媒体助手</title></head>
<body><main><header><div class="brand"><span class="logo">↓</span><div><strong>kownload 媒体助手</strong><small id="site">当前页面</small></div></div><label class="switch">本站关闭 <input id="siteOff" type="checkbox"></label></header>
<div class="toolbar"><button class="chip active" data-kind="all">全部 <b id="n-all">0</b></button><button class="chip" data-kind="video">▶ 视频 <b id="n-video">0</b></button><button class="chip" data-kind="image">▧ 图片 <b id="n-image">0</b></button><button class="chip" data-kind="audio">♫ 音频 <b id="n-audio">0</b></button></div>
<div class="filters"><input id="search" placeholder="筛选名称或地址"><label><input type="checkbox" id="showAll"> 显示小图</label></div>
<div class="summary"><label><input type="checkbox" id="selectAll"> 全选当前列表</label><span id="count"></span></div><button id="deepSearch" hidden>增强识别这个视频</button><section id="list" class="list"></section>
<footer><div class="fields"><label>名称<input id="name" placeholder="留空使用原名"></label><label>保存位置<input id="path" placeholder="kownload 默认目录"></label></div><div id="formats"></div><div id="status" role="status"></div><button id="download" class="primary">下载已选资源</button><details><summary>更新暂停或失败的任务</summary><button id="findTasks">查找本页可更新任务</button><select id="recoverTask" aria-label="选择要更新的任务"><option value="">请先查找任务</option></select><button id="update">更新资源地址并继续</button></details></footer></main><script type="module" src="popup.js"></script></body></html>
