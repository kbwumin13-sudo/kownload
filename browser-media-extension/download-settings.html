<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>kownload 下载接管</title><link rel="stylesheet" href="download-capture.css"><main><h1>普通下载接管</h1><p>将普通网页文件交给 kownload。连接不可用时继续浏览器下载。</p><p>启用前请关闭其他扩展的普通下载接管，避免同时处理同一笔下载。</p><label><input id="enabled" type="checkbox">启用接管</label><label><input id="confirm" type="checkbox" checked>接管前确认</label><p id="status" role="status"></p><p>网页临时生成的文件、表单提交的下载、无痕窗口和其他扩展发起的下载，仍由浏览器处理。</p></main><script type="module" src="download-settings.js"></script></html>
