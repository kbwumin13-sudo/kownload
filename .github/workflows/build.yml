name: kownload macOS release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Existing kownload release tag to build
        required: true
      publish:
        description: Publish this exact tag and its build artifacts
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
      - name: Validate selected release tag
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          python3 - <<'PY'
          import json, os
          m = json.load(open('config/release.json'))
          assert os.environ['RELEASE_REF'] == f"v{m['appVersion']}-kownload.{m['revision']}"
          PY
      - name: Build macOS assets
        env:
          FLUTTER_BIN: ${{ env.FLUTTER_ROOT }}/bin/flutter
        run: scripts/macos-frontend-build.sh --output "$RUNNER_TEMP/kownload-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: kownload-release
          path: ${{ runner.temp }}/kownload-dist/
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kownload-release
          path: dist
      - name: Publish selected tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ inputs.ref }}
        run: gh release create "$RELEASE_REF" --verify-tag --title "kownload $RELEASE_REF" --generate-notes dist/*.dmg dist/*.zip dist/*source.tar.gz dist/SHA256SUMS.txt dist/build-manifest.json
