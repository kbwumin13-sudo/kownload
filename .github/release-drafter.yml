name-template: "kownload v$NEXT_PATCH_VERSION"
tag-template: "v$NEXT_PATCH_VERSION"
categories:
  - title: "🆕 Features"
    labels:
      - "feat"
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
      - "bugfix"
      - "bug"
  - title: "🔧 Performance Improvements"
    labels:
      - "perf"
  - title: "🧪 Tests"
    label: "test"
  - title: "🧰 Maintenance"
    label: "chore"
  - title: "📖 Document"
    label: "docs"
  - title: "🚀 CI/CD"
    label: "ci"
  - title: "🌎 Internationalization"
    label: "translation"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
version-resolver:
  major:
    labels:
      - "major"
  minor:
    labels:
      - "minor"
  patch:
    labels:
      - "patch"
  default: patch
template: |
  ## kownload 更新

  $CHANGES

  安装包仅在正式 Release 的 Assets 中提供。请按芯片型号选择文件，并核对 SHA256SUMS.txt。

  [安装与使用](https://github.com/kbwumin13-sudo/kownload#安装)
